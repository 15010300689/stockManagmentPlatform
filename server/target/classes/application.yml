server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.stock.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: StockManagementSecretKey2024
  expiration: 86400000  # 24 hours
